[project]
name = "noctalia-i18n-watcher"
version = "2.0.1"
description = "Discord change monitor for localization projects on Noctalia Translate"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Obelus" }]
dependencies = [
  "discord.py>=2.7.1",
  "noctalia-i18n-core>=0.5.0",
  "PyYAML>=6.0.3",
  "requests[socks]>=2.34.2",
]

[project.urls]
Homepage = "https://github.com/Obelusod/noctalia-i18n-watcher"
Issues = "https://github.com/Obelusod/noctalia-i18n-watcher/issues"
Source = "https://github.com/Obelusod/noctalia-i18n-watcher"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pyrefly>=1.4.0",
  "types-PyYAML",
  "ruff>=0.16.2",
]

[tool.pyrefly]
project-includes = ["noctalia_i18n_watcher", "tests"]
python-version = "3.12"
preset = "strict"
min-severity = "warn"
search-path = ["."]
infer-with-first-use = false
type-ignore-unknown-tag-behavior = "no-effect"

[tool.pyrefly.errors]
explicit-any = "error"
unreachable = "error"
unreachable-match-case = "error"
unknown-argument-type = "error"
unknown-variable-type = "error"
unknown-return-type = "error"
unknown-attribute-access = "error"
unknown-attribute-type = "error"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
  "A", "ANN", "ARG", "B", "C4", "E4", "E7", "E9", "F", "I", "PGH003",
  "RUF006", "RUF007", "RUF008", "RUF009", "RUF012", "RUF013", "RUF100",
  "SIM", "UP",
]

[tool.hatch.build.targets.wheel]
packages = ["noctalia_i18n_watcher"]

[tool.hatch.build.targets.sdist]
include = [
  "LICENSE",
  "README.md",
  "README.zh-CN.md",
  "config",
  "noctalia_i18n_watcher",
  "pyproject.toml",
  "scripts",
  "systemd",
  "tests",
]
