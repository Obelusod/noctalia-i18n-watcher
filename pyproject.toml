[project]
name = "noctalia-i18n-watcher"
version = "1.0.0"
description = "Discord change monitor for localization projects on Noctalia Translate"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Obelus" }]
dependencies = [
  "noctalia-i18n-core==0.1.1",
  "requests[socks]==2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "basedpyright==1.39.9",
  "ruff==0.15.22",
]

[tool.basedpyright]
include = ["noctalia_i18n_watcher", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportImplicitOverride = "error"
reportUnreachable = "error"
venv = ".venv"
venvPath = "."

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["noctalia_i18n_watcher"]
