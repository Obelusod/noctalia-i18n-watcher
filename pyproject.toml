[project]
name = "noctalia-i18n-watcher"
version = "2.0.0"
description = "Discord change monitor for localization projects on Noctalia Translate"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Obelus" }]
dependencies = [
  "discord.py==2.7.1",
  "noctalia-i18n-core==0.4.0",
  "PyYAML==6.0.3",
  "requests[socks]==2.34.2",
]

[project.urls]
Homepage = "https://github.com/Obelusod/noctalia-i18n-watcher"
Issues = "https://github.com/Obelusod/noctalia-i18n-watcher/issues"
Source = "https://github.com/Obelusod/noctalia-i18n-watcher"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "basedpyright==1.39.9",
  "ruff==0.16.2",
]

[tool.basedpyright]
include = ["noctalia_i18n_watcher", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportImplicitOverride = "error"
reportUnreachable = "error"
venv = ".venv"
venvPath = "."

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["noctalia_i18n_watcher"]

[tool.hatch.build.targets.sdist]
include = [
  "LICENSE",
  "README.md",
  "README.zh-CN.md",
  "config",
  "noctalia_i18n_watcher",
  "pyproject.toml",
  "scripts",
  "systemd",
  "tests",
]
