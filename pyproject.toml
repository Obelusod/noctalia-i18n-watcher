[project]
name = "noctalia-i18n-watcher"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4==4.15.0",
  "PyYAML==6.0.3",
  "requests[socks]==2.34.2",
]

[dependency-groups]
dev = [
  "basedpyright==1.39.9",
  "ruff==0.15.20",
]

[tool.basedpyright]
include = ["noctalia_i18n_watcher", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportDeprecated = "error"
venv = ".venv"
venvPath = "."

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.uv]
package = false
