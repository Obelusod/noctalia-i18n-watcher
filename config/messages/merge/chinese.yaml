source:
  title: "[English] 原文变更 · {count} 条"
  timestamp: "{last_timestamp}"
  color: 0x5865F2
  author:
    name: "{actors}"
    icon_url: "{actor_avatar_url:fallback=https://github.com/noctalia-dev.png}"
  description: "{entries}"
  footer:
    text: "新增 {added_count} · 修改 {modified_count} · 删除 {deleted_count}"
target:
  title: "[{locale}] 译文变更 · {count} 条"
  timestamp: "{last_timestamp}"
  color: 0x5865F2
  author:
    name: "{actors}"
    icon_url: "{actor_avatar_url:fallback=https://github.com/noctalia-dev.png}"
  description: "{entries}"
  footer:
    text: "新增 {added_count} · 修改 {modified_count} · 删除 {deleted_count}"
diff:
  old: {color: red, bold: true, underline: false}
  new: {color: green, bold: true, underline: false}
entries:
  separator: "\n"
  added: |-
    **{key_link}**
    ```ansi
    − ∅
    + {new_diff}
    ```
  modified: |-
    **{key_link}**
    ```ansi
    − {old_diff}
    + {new_diff}
    ```
  deleted: |-
    **{key_link}**
    ```ansi
    − {old_diff}
    + ∅
    ```
