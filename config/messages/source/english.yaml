added:
  title: "[English] Added 1 source text"
  url: "{change_url}"
  timestamp: "{timestamp}"
  color: 0x57F287
  author:
    name: "{actor}"
    url: "{actor_url}"
    icon_url: "{actor_avatar_url:fallback=https://github.com/noctalia-dev.png}"
  fields:
    - name: KEY
      value: "`{key}`"
      inline: false
    - name: ENGLISH
      value: "`{new_value}`"
      inline: false
modified:
  title: "[English] Modified 1 source text"
  url: "{change_url}"
  timestamp: "{timestamp}"
  color: 0xFEE75C
  author:
    name: "{actor}"
    url: "{actor_url}"
    icon_url: "{actor_avatar_url:fallback=https://github.com/noctalia-dev.png}"
  fields:
    - name: KEY
      value: "`{key}`"
      inline: false
    - name: OLD
      value: "`{old_value}`"
      inline: false
    - name: NEW
      value: "`{new_value}`"
      inline: false
deleted:
  title: "[English] Deleted 1 source text"
  url: "{change_url}"
  timestamp: "{timestamp}"
  color: 0xED4245
  author:
    name: "{actor}"
    url: "{actor_url}"
    icon_url: "{actor_avatar_url:fallback=https://github.com/noctalia-dev.png}"
  fields:
    - name: KEY
      value: "`{key}`"
      inline: false
    - name: ENGLISH
      value: "`{old_value}`"
      inline: false
