diff:
  old: {color: red, bold: true, underline: false}
  new: {color: green, bold: true, underline: false}
added:
  title: "[{locale}] 新增了 1 条译文"
  timestamp: "{timestamp}"
  color: 0x57F287
  author:
    name: "{actor}"
    url: "{actor_url}"
    icon_url: "{actor_avatar_url:fallback=https://github.com/noctalia-dev.png}"
  fields:
    - name: 键名
      value: "**{key_link}**"
      inline: false
    - name: 英文
      value: "`{source}`"
      inline: false
    - name: 变更
      value: |-
        ```ansi
        + {new_diff}
        ```
      inline: false
modified:
  title: "[{locale}] 修改了 1 条译文"
  timestamp: "{timestamp}"
  color: 0xFEE75C
  author:
    name: "{actor}"
    url: "{actor_url}"
    icon_url: "{actor_avatar_url:fallback=https://github.com/noctalia-dev.png}"
  fields:
    - name: 键名
      value: "**{key_link}**"
      inline: false
    - name: 英文
      value: "`{source}`"
      inline: false
    - name: 变更
      value: |-
        ```ansi
        − {old_diff}
        + {new_diff}
        ```
      inline: false
deleted:
  title: "[{locale}] 删除了 1 条译文"
  timestamp: "{timestamp}"
  color: 0xED4245
  author:
    name: "{actor}"
    url: "{actor_url}"
    icon_url: "{actor_avatar_url:fallback=https://github.com/noctalia-dev.png}"
  fields:
    - name: 键名
      value: "**{key_link}**"
      inline: false
    - name: 英文
      value: "`{source}`"
      inline: false
    - name: 变更
      value: |-
        ```ansi
        − {old_diff}
        ```
      inline: false
