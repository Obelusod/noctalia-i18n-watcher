diff:
  old: {color: red, bold: true, underline: false}
  new: {color: green, bold: true, underline: false}
added:
  title: "[{locale}] Added 1 translation"
  timestamp: "{timestamp}"
  color: 0x57F287
  author:
    name: "{actor}"
    url: "{actor_url}"
    icon_url: "{actor_avatar_url:fallback=https://github.com/noctalia-dev.png}"
  fields:
    - name: KEY
      value: "{key_link}"
      inline: false
    - name: ENGLISH
      value: "`{source}`"
      inline: false
    - name: CHANGE
      value: |-
        ```ansi
        + {new_diff}
        ```
      inline: false
modified:
  title: "[{locale}] Modified 1 translation"
  timestamp: "{timestamp}"
  color: 0xFEE75C
  author:
    name: "{actor}"
    url: "{actor_url}"
    icon_url: "{actor_avatar_url:fallback=https://github.com/noctalia-dev.png}"
  fields:
    - name: KEY
      value: "{key_link}"
      inline: false
    - name: ENGLISH
      value: "`{source}`"
      inline: false
    - name: CHANGE
      value: |-
        ```ansi
        − {old_diff}
        + {new_diff}
        ```
      inline: false
deleted:
  title: "[{locale}] Deleted 1 translation"
  timestamp: "{timestamp}"
  color: 0xED4245
  author:
    name: "{actor}"
    url: "{actor_url}"
    icon_url: "{actor_avatar_url:fallback=https://github.com/noctalia-dev.png}"
  fields:
    - name: KEY
      value: "{key_link}"
      inline: false
    - name: ENGLISH
      value: "`{source}`"
      inline: false
    - name: CHANGE
      value: |-
        ```ansi
        − {old_diff}
        ```
      inline: false
